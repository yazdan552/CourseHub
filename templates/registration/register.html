{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow-sm">

            <div class="card-body">

                <h2 class="mb-4">
                    Register
                </h2>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        class="btn btn-success w-100"
                        type="submit"
                    >
                        Register
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
