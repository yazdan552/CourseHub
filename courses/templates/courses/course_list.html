{% extends "base.html" %}

{% block content %}

    <h1 class="mb-4">
        Courses
    </h1>

    <div class="row">


        {% for course in courses %}

            <div class="col-md-4 mb-4">

                <div class="card h-100 shadow-sm">

                    <div class="card-body">

                        <h4>
                            {{ course.title }}
                        </h4>

                        <p>
                            {{ course.instructor }}
                        </p>

                        <p>
                            ${{ course.price }}
                        </p>

                        <p>
                            Students: {{ course.enrollments.count }}
                        </p>

                        <a
                                href="{% url 'course_detail' course.id %}"
                                class="btn btn-primary"
                        >
                            View Details
                        </a>

                    </div>

                </div>

            </div>

        {% empty %}

            <h4>
                No courses available.
            </h4>

        {% endfor %}

    </div>

{% endblock %}
