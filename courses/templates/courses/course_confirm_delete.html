{% extends "base.html" %}

{% block title %}Delete Course - CourseHub{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm fade-in">
            <div class="card-body text-center">
                <div class="mb-4">
                    <i class="bi bi-exclamation-triangle" style="font-size: 4rem; color: var(--danger);"></i>
                </div>
                <h2 class="section-title mb-3">Delete Course</h2>
                <p class="text-muted">
                    Are you sure you want to delete
                    <strong class="text-danger">{{ course.title }}</strong>?
                </p>
                <p class="text-muted small">This action cannot be undone.</p>

                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <div class="btn-group">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Yes, Delete
                        </button>
                        <a href="{% url 'course_detail' course.id %}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
