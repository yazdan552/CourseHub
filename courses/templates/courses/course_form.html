{% extends "base.html" %}

{% block content %}

    <div class="card shadow-sm">

        <div class="card-body">

            <h2>
                {% if form.instance.pk %}
                    Edit Course
                {% else %}
                    Create Course
                {% endif %}
            </h2>
            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button
                        type="submit"
                        class="btn btn-success"
                >
                    {% if form.instance.pk %}
                        Update
                    {% else %}
                        Create
                    {% endif %}
                </button>

                <a
                        href="{% url 'course_list' %}"
                        class="btn btn-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

{% endblock %}
